<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio Data — Your Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── RESULT PAGE ── */
    body { background: var(--off-white); }

    .result-wrapper {
      min-height: 100vh;
      padding: 80px 0 40px;
      position: relative;
      z-index: 1;
    }

    /* TOP HERO BANNER */
    .result-hero-banner {
      width: 100%;
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a2e 60%, #0071e3 100%);
      padding: 80px 24px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .result-hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('images/pattern-dots.svg');
      background-size: 60px 60px;
      opacity: 0.2;
    }
    .banner-glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,113,227,0.35) 0%, transparent 70%);
      top: -150px; left: 50%;
      transform: translateX(-50%);
      animation: pulse-glow 4s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
      50%       { transform: translateX(-50%) scale(1.15); opacity: 1; }
    }
    .avatar-outer {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
      z-index: 1;
    }
    .avatar-ring {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 0 6px rgba(0,113,227,0.2), 0 12px 40px rgba(0,0,0,0.4);
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      animation: avatar-pop 0.7s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes avatar-pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .banner-name {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(28px, 6vw, 52px);
      color: #ffffff;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      position: relative; z-index: 1;
      opacity: 0;
      animation: slide-up 0.6s 0.4s ease forwards;
    }
    .banner-role {
      font-size: clamp(14px, 2vw, 17px);
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
      position: relative; z-index: 1;
      opacity: 0;
      animation: slide-up 0.6s 0.55s ease forwards;
    }
    .banner-badges {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      position: relative; z-index: 1;
      opacity: 0;
      animation: slide-up 0.6s 0.7s ease forwards;
    }
    .banner-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      font-size: 12px; font-weight: 500;
      padding: 6px 14px; border-radius: 100px;
      backdrop-filter: blur(10px);
    }
    @keyframes slide-up {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* CONTENT AREA */
    .result-content {
      max-width: 700px;
      margin: -60px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }

    /* CARD BLOCKS */
    .result-block {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .block-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-hint);
    }

    /* INFO GRID */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-top: 20px;
    }
    .info-row {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child, .info-row:nth-last-child(2) { border-bottom: none; }

    /* STATS strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .stat-cell {
      padding: 28px 16px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-num {
      font-family: 'Instrument Serif', serif;
      font-size: 32px;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-lbl {
      font-size: 11px;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* ACTIONS */
    .actions-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 32px 0 16px;
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f5 25%, #e8e8f0 50%, #f0f0f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Print styles */
    @media print {
      .navbar, .actions-row { display: none !important; }
      .result-hero-banner { padding: 40px 24px 60px; }
      .result-block { box-shadow: none; border: 1px solid #e0e0e5; }
      body { background: white; }
    }

    @media (max-width: 600px) {
      .info-grid { grid-template-columns: 1fr; }
      .info-row { border-bottom: 1px solid var(--border); }
      .info-row:last-child { border-bottom: none; }
      .result-content { padding: 0 16px; }
      .result-block > div[style*="padding:36px"] { padding: 24px 20px !important; }
    }
  </style>
</head>
<body>

  <!-- BG -->
  <div class="bg-decor" style="opacity:0.35;">
    <div class="bg-blob bg-blob-1" style="top:auto;bottom:-200px;left:-200px;"></div>
    <div class="bg-blob bg-blob-2" style="bottom:auto;top:-100px;right:-100px;"></div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">Bio<span>Data</span></a>
    <div class="navbar-steps">
      <span style="font-size:12px;color:var(--text-hint);">Step</span>
      <div class="step-dot done" title="Form Filled"></div>
      <div class="step-dot active" title="View Profile"></div>
    </div>
  </nav>

  <div class="result-wrapper">

    <!-- HERO BANNER -->
    <div class="result-hero-banner">
      <div class="banner-glow"></div>

      <div class="avatar-outer">
        <div class="avatar-ring" id="banner-avatar">
          <img src="images/default-avatar.svg" alt="Avatar" style="width:100%;height:100%;object-fit:cover;">
        </div>
        <!-- Online indicator -->
        <div style="position:absolute;bottom:4px;right:4px;
                    width:16px;height:16px;border-radius:50%;
                    background:#32d74b;border:2.5px solid #1a1a2e;
                    box-shadow:0 0 8px rgba(50,215,75,0.6);z-index:2;"></div>
      </div>

      <div class="banner-name" id="banner-name">Loading…</div>
      <div class="banner-role" id="banner-role">—</div>
      <div class="banner-badges" id="banner-badges"></div>
    </div>

    <!-- CONTENT -->
    <div class="result-content">

      <!-- STATS STRIP -->
      <div class="stats-strip sr" id="stats-strip">
        <div class="stat-cell">
          <div class="stat-num" id="stat-age">—</div>
          <div class="stat-lbl">Age</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num" id="stat-skills">—</div>
          <div class="stat-lbl">Skills</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num" id="stat-edu">—</div>
          <div class="stat-lbl">Education</div>
        </div>
      </div>

      <!-- DYNAMIC BLOCKS -->
      <div id="result-root">

        <!-- Skeleton loader (shown while JS loads) -->
        <div class="result-block" id="skeleton-block" style="padding:36px 40px;">
          <div class="skeleton" style="height:14px;width:60px;margin-bottom:20px;"></div>
          <div class="skeleton" style="height:20px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:20px;width:75%;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:20px;width:50%;"></div>
        </div>

      </div>

    </div><!-- /result-content -->

  </div><!-- /result-wrapper -->

  <script src="assets/js/app.js"></script>
  <script>
    // Load photo into banner avatar
    document.addEventListener('DOMContentLoaded', () => {
      const photo = sessionStorage.getItem('bioPhoto');
      if (photo) {
        document.getElementById('banner-avatar').innerHTML =
          `<img src="${photo}" alt="Profile" style="width:100%;height:100%;object-fit:cover;">`;
      }

      const raw = sessionStorage.getItem('bioData');
      if (!raw) return;
      const d = JSON.parse(raw);

      // Banner name & role
      document.getElementById('banner-name').textContent = d.name || 'Your Name';
      document.getElementById('banner-role').textContent =
        [d.occupation, d.company].filter(Boolean).join(' · ') || 'Professional';

      // Banner badges
      const badges = [];
      if (d.city || d.country) badges.push('📍 ' + [d.city, d.country].filter(Boolean).join(', '));
      if (d.gender) badges.push(d.gender === 'male' ? '♂ Male' : d.gender === 'female' ? '♀ Female' : '⚥ ' + d.gender);
      badges.push('✓ Profile Complete');
      document.getElementById('banner-badges').innerHTML =
        badges.map(b => `<span class="banner-badge">${b}</span>`).join('');

      // Stats
      if (d.dob) {
        const age = Math.floor((Date.now() - new Date(d.dob)) / (1000 * 60 * 60 * 24 * 365.25));
        document.getElementById('stat-age').textContent = age;
      }
      const skills = d.skills ? d.skills.split(',').filter(s=>s.trim()).length : 0;
      document.getElementById('stat-skills').textContent = skills || '—';
      const edu = d.education ? d.education.trim().split(/\s+/).pop() : '—';
      document.getElementById('stat-edu').textContent = edu;

      // Remove skeleton
      const skel = document.getElementById('skeleton-block');
      if (skel) skel.remove();
    });
  </script>
</body>
</html>
